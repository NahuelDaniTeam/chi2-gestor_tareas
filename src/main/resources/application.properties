spring.application.name=chi2-gestor-tareas

# Puerto propio: el web principal usa 8080 y peluquería 8081
server.port=${PORT:8082}

# JPA: el esquema lo manejan las migraciones de Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Actuator: health (lo usa el script de inicio) e info (versión)

# Docker Compose: dejar Postgres corriendo al cerrar la app, así abrirla de nuevo es instantáneo
spring.docker.compose.lifecycle-management=start-only

# Gestor de tareas (docs/01-especificacion.md)
# Zona para calcular "hoy". La app guarda todo en UTC; esta zona solo decide qué día es.
chi2.tareas.zona=America/Argentina/Cordoba
# Etapa 1 (uso personal, sin login): todas las tareas son de este usuario.
# Etapa 2 lo reemplaza por el usuario logueado.
chi2.tareas.usuario-local=00000000-0000-0000-0000-000000000001
# Las tareas eliminadas quedan en la papelera este tiempo y después se borran solas.
chi2.tareas.retencion-papelera=P30D

# Estáticos: el navegador siempre revalida (304 si no cambiaron). Así una versión nueva del JS
# nunca se mezcla con módulos viejos en caché.
spring.web.resources.cache.cachecontrol.no-cache=true

# Respaldos (docs/01-especificacion.md §4.15): un JSON por día, se conservan los últimos 30.
chi2.respaldos.automaticos=${CHI2_RESPALDOS_AUTOMATICOS:true}
chi2.respaldos.carpeta=${CHI2_RESPALDOS_CARPETA:${user.home}/CHI2-Tareas/respaldos}
chi2.respaldos.conservar=30

# Versión de la app (Maven la completa al compilar) y endpoint /actuator/info
info.app.version=@project.version@
management.info.env.enabled=true
management.endpoints.web.exposure.include=health,info

# Documentación de la API: JSON en /v3/api-docs y Swagger UI en /api/docs
springdoc.swagger-ui.path=/api/docs
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operations-sorter=alpha
