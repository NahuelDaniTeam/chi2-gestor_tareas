# Integración continua: cada PR (y cada push a main) compila y corre todos los tests.
# 1. verify: build + tests de Java (con PostgreSQL real vía Testcontainers) + tests de JavaScript.
# 2. e2e: la app en Chrome, Firefox y celular con Playwright, más la auditoría de accesibilidad (axe).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build y tests (Java + JS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: ./mvnw verify
        run: ./mvnw -B -ntp verify

  e2e:
    name: Punta a punta (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: CSS
        run: npm run build:css
      - name: Navegadores
        run: npx playwright install --with-deps chromium firefox
      - name: Tests de punta a punta
        run: npx playwright test
        env:
          CI: 'true'
      - name: Reporte
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 14
